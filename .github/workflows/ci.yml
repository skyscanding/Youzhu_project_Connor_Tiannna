name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖（Youzhu + Fork1）
        run: |
          pip install --upgrade pip
          pip install -r Youzhu/requirements.txt
          pip install -r Fork1/requirements.txt

      - name: 测试 Youzhu（信源库 + 爬虫 + 合规校验）
        working-directory: Youzhu
        run: python -m pytest -q

      - name: 测试 Fork1（规模传导 + WebApp + 全套件）
        working-directory: Fork1
        run: python -m pytest -q
